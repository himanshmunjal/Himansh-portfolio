<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7383"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Layer boxes -->
  <g fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.5">
    <rect x="20" y="140" width="250" height="725" rx="10"/>
    <rect x="320" y="140" width="270" height="725" rx="10"/>
    <rect x="640" y="140" width="690" height="725" rx="10"/>
    <rect x="1360" y="140" width="220" height="725" rx="10"/>
  </g>
  <g fill="#555" font-size="17" font-weight="600" letter-spacing="0.5">
    <text x="38" y="170">INPUT</text>
    <text x="338" y="170">MODEL</text>
    <text x="658" y="170">ADAPTIVEKVCACHE (ONE PER LAYER)</text>
    <text x="1378" y="170">OUTPUT</text>
  </g>

  <!-- Component boxes -->
  <g fill="#ffffff" stroke="#222" stroke-width="2">
    <rect x="40" y="210" width="210" height="120" rx="8"/>
    <rect x="340" y="220" width="230" height="100" rx="8"/>
    <rect x="340" y="400" width="230" height="160" rx="8"/>
    <rect x="660" y="400" width="250" height="100" rx="8"/>
    <rect x="1020" y="400" width="290" height="100" rx="8"/>
    <rect x="1020" y="560" width="290" height="75" rx="8"/>
    <rect x="1020" y="700" width="290" height="140" rx="8"/>
    <rect x="660" y="720" width="250" height="100" rx="8"/>
    <rect x="1380" y="400" width="180" height="100" rx="8"/>
  </g>

  <!-- Component names -->
  <g fill="#222" font-size="21" font-weight="700" text-anchor="middle">
    <text x="145" y="248">Eval Harness</text>
    <text x="455" y="258">Generation Loop</text>
    <text x="455" y="450">HF Transformer</text>
    <text x="785" y="440">Importance Tracker</text>
    <text x="1165" y="440">Tiering Policy</text>
    <text x="1165" y="592">Quantizer</text>
    <text x="1165" y="732">Tier Store</text>
    <text x="785" y="760">Dequant &amp; Reorder</text>
    <text x="1470" y="440">Results</text>
  </g>

  <!-- Component sub-labels -->
  <g fill="#444" font-size="17" text-anchor="middle">
    <text x="145" y="280">WikiText-2, LongBench,</text>
    <text x="145" y="303">NIAH prompts</text>
    <text x="455" y="290">greedy decode, batch 1</text>
    <text x="455" y="482">Qwen2.5-1.5B-Instruct</text>
    <text x="455" y="507">Phi-3-mini-4k-instruct</text>
    <text x="455" y="532">(FP16, attention layers)</text>
    <text x="785" y="472">EMA score per token</text>
    <text x="1165" y="472">re-rank every 16 tokens</text>
    <text x="1165" y="620">per-channel K, per-token V</text>
    <text x="785" y="792">memoized, position order</text>
    <text x="1470" y="472">JSON + CSV</text>
  </g>
  <g fill="#222" font-size="17">
    <text x="1040" y="765"><tspan font-weight="700">FP16</tspan>  sinks, recent, top 30%</text>
    <text x="1040" y="793"><tspan font-weight="700">INT8</tspan>  next 30%</text>
    <text x="1040" y="821"><tspan font-weight="700">INT4</tspan>  the rest (packed)</text>
  </g>

  <!-- Grey (control / reporting) arrows -->
  <g fill="none" stroke="#222" stroke-width="2">
    <line x1="250" y1="270" x2="338" y2="270" marker-end="url(#ag)"/>
    <line x1="425" y1="320" x2="425" y2="398" marker-end="url(#ag)"/>
    <line x1="505" y1="400" x2="505" y2="322" marker-end="url(#ag)"/>
    <polyline points="455,220 455,95 1470,95 1470,398" marker-end="url(#ag)"/>
    <polyline points="1310,770 1495,770 1495,502" marker-end="url(#ag)"/>
  </g>
  <g fill="#222" font-size="17">
    <text x="294" y="256" text-anchor="middle">prompts</text>
    <text x="417" y="366" text-anchor="end">input_ids</text>
    <text x="513" y="366">logits</text>
    <text x="962" y="83" text-anchor="middle">generated text, NLL, tokens/s</text>
    <text x="1487" y="640" text-anchor="end">cache bytes,</text>
    <text x="1487" y="662" text-anchor="end">tier counts</text>
  </g>

  <!-- Accent (main K/V data path) arrows -->
  <g fill="none" stroke="#2f7383" stroke-width="3">
    <line x1="570" y1="450" x2="657" y2="450" marker-end="url(#at)"/>
    <line x1="910" y1="450" x2="1017" y2="450" marker-end="url(#at)"/>
    <line x1="1165" y1="500" x2="1165" y2="557" marker-end="url(#at)"/>
    <line x1="1165" y1="635" x2="1165" y2="697" marker-end="url(#at)"/>
    <line x1="1020" y1="770" x2="913" y2="770" marker-end="url(#at)"/>
    <polyline points="660,770 455,770 455,563" marker-end="url(#at)"/>
  </g>
  <g fill="#2f7383" font-size="17" font-weight="600">
    <text x="614" y="434" text-anchor="middle">new K/V</text>
    <text x="965" y="434" text-anchor="middle">scores</text>
    <text x="1150" y="536" text-anchor="end">tier per token</text>
    <text x="1150" y="673" text-anchor="end">INT8/INT4 codes + scales</text>
    <text x="962" y="754" text-anchor="middle">stored K/V</text>
    <text x="557" y="754" text-anchor="middle">dequantized K/V</text>
  </g>
</svg>
