<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #222; }
      .band { fill: #f6f6f6; stroke: #222; stroke-width: 1; }
      .bl { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; }
      .main { fill: #fff; stroke: #3a6ea5; stroke-width: 2.5; }
      .t { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .s { font-size: 15px; text-anchor: middle; fill: #444; }
      .l { font-size: 15px; }
      .lm { font-size: 15px; text-anchor: middle; }
      .ln { stroke: #222; stroke-width: 1.8; fill: none; }
      .acc { stroke: #3a6ea5; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <!-- ===== Bands ===== -->
  <rect class="band" x="286" y="60" width="552" height="170" rx="8"/>
  <text class="bl" x="300" y="86">EXTERNAL SERVICES (cached)</text>

  <rect class="band" x="16" y="340" width="160" height="210" rx="8"/>
  <text class="bl" x="30" y="366">CLIENT</text>
  <rect class="band" x="286" y="340" width="250" height="210" rx="8"/>
  <text class="bl" x="300" y="366">API</text>
  <rect class="band" x="646" y="340" width="700" height="210" rx="8"/>
  <text class="bl" x="660" y="366">PROCESSING</text>
  <rect class="band" x="1456" y="340" width="134" height="210" rx="8"/>
  <text class="bl" x="1470" y="366">OUTPUT</text>

  <rect class="band" x="646" y="590" width="700" height="180" rx="8"/>
  <text class="bl" x="660" y="616">STORAGE</text>
  <rect class="band" x="16" y="590" width="520" height="180" rx="8"/>
  <text class="bl" x="30" y="616">OFFLINE TRAINING</text>

  <!-- ===== External services ===== -->
  <rect class="box" x="298" y="100" width="108" height="105" rx="6"/>
  <text class="t" x="352" y="140">Photon /</text>
  <text class="t" x="352" y="164">Nominatim</text>
  <text class="s" x="352" y="188">geocoding</text>

  <rect class="box" x="416" y="100" width="108" height="105" rx="6"/>
  <text class="t" x="470" y="146">OSRM</text>
  <text class="s" x="470" y="172">road routing</text>

  <rect class="box" x="658" y="100" width="168" height="105" rx="6"/>
  <text class="t" x="742" y="140">Context feeds</text>
  <text class="s" x="742" y="164">Open-Meteo weather,</text>
  <text class="s" x="742" y="184">NYC events</text>

  <!-- ===== Main row ===== -->
  <rect class="main" x="28" y="400" width="136" height="100" rx="6"/>
  <text class="t" x="96" y="444">Dashboard</text>
  <text class="s" x="96" y="468">map + form</text>

  <rect class="main" x="298" y="400" width="226" height="100" rx="6"/>
  <text class="t" x="411" y="444">FastAPI service</text>
  <text class="s" x="411" y="468">places + road route</text>

  <rect class="main" x="658" y="400" width="168" height="100" rx="6"/>
  <text class="t" x="742" y="436">Feature builder</text>
  <text class="s" x="742" y="460">H3 speeds, time,</text>
  <text class="s" x="742" y="480">holidays</text>

  <rect class="main" x="906" y="400" width="168" height="100" rx="6"/>
  <text class="t" x="990" y="444">Trip-time model</text>
  <text class="s" x="990" y="468">XGBoost</text>

  <rect class="main" x="1154" y="400" width="180" height="100" rx="6"/>
  <text class="t" x="1244" y="436">Rate-card engine</text>
  <text class="s" x="1244" y="460">meter, flat fares,</text>
  <text class="s" x="1244" y="480">surcharges</text>

  <rect class="main" x="1468" y="400" width="110" height="100" rx="6"/>
  <text class="t" x="1523" y="444">Fare quote</text>
  <text class="s" x="1523" y="468">+ range</text>
  <text class="s" x="1523" y="522">JSON back</text>
  <text class="s" x="1523" y="541">to Dashboard</text>

  <!-- ===== Storage ===== -->
  <rect class="box" x="658" y="630" width="416" height="110" rx="6"/>
  <text class="t" x="900" y="672">Model artifacts</text>
  <text class="s" x="900" y="698">duration_model.json, H3 speed tables</text>
  <text class="s" x="900" y="718">(artifacts/)</text>

  <rect class="box" x="1154" y="630" width="180" height="110" rx="6"/>
  <text class="t" x="1244" y="664">City rate cards</text>
  <text class="t" x="1244" y="688">+ calibration</text>
  <text class="s" x="1244" y="714">cities/*.json</text>

  <!-- ===== Offline training ===== -->
  <rect class="box" x="28" y="640" width="180" height="100" rx="6"/>
  <text class="t" x="118" y="682">TLC trip records</text>
  <text class="s" x="118" y="708">12 months, Parquet</text>

  <rect class="box" x="300" y="640" width="224" height="100" rx="6"/>
  <text class="t" x="412" y="678">Training pipeline</text>
  <text class="s" x="412" y="702">train.py: XGBoost,</text>
  <text class="s" x="412" y="722">meter + app fit</text>

  <!-- ===== Main path arrows (accent) ===== -->
  <line class="acc" x1="164" y1="450" x2="294" y2="450" marker-end="url(#b)"/>
  <text class="lm" x="231" y="420">POST</text>
  <text class="lm" x="231" y="438">/api/predict</text>

  <line class="acc" x1="524" y1="450" x2="654" y2="450" marker-end="url(#b)"/>
  <text class="lm" x="591" y="420">route km,</text>
  <text class="lm" x="591" y="438">lat/lon, time</text>

  <line class="acc" x1="826" y1="450" x2="902" y2="450" marker-end="url(#b)"/>
  <text class="lm" x="866" y="438">features</text>

  <line class="acc" x1="1074" y1="450" x2="1150" y2="450" marker-end="url(#b)"/>
  <text class="lm" x="1114" y="438">minutes</text>

  <line class="acc" x1="1334" y1="450" x2="1464" y2="450" marker-end="url(#b)"/>
  <text class="lm" x="1401" y="438">price</text>

  <!-- ===== External calls ===== -->
  <line class="ln" x1="352" y1="209" x2="352" y2="396" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="344" y="280" text-anchor="end">address,</text>
  <text class="l" x="344" y="298" text-anchor="end">lat/lon</text>

  <line class="ln" x1="470" y1="209" x2="470" y2="396" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="478" y="280">coords,</text>
  <text class="l" x="478" y="298">road route</text>

  <line class="ln" x1="790" y1="205" x2="790" y2="396" marker-end="url(#a)"/>
  <text class="l" x="798" y="280">hourly weather,</text>
  <text class="l" x="798" y="298">events</text>

  <!-- ===== Storage reads ===== -->
  <line class="ln" x1="790" y1="630" x2="790" y2="504" marker-end="url(#a)"/>
  <text class="l" x="798" y="572">speed tables</text>

  <line class="ln" x1="990" y1="630" x2="990" y2="504" marker-end="url(#a)"/>
  <text class="l" x="998" y="572">trained trees</text>

  <line class="ln" x1="1244" y1="630" x2="1244" y2="504" marker-end="url(#a)"/>
  <text class="l" x="1252" y="562">tariff rules,</text>
  <text class="l" x="1252" y="580">calibration</text>

  <!-- ===== Training flows ===== -->
  <line class="ln" x1="208" y1="690" x2="296" y2="690" marker-end="url(#a)"/>
  <text class="lm" x="254" y="678">1.5M trips</text>

  <line class="ln" x1="524" y1="690" x2="654" y2="690" marker-end="url(#a)"/>
  <text class="lm" x="591" y="660">model,</text>
  <text class="lm" x="591" y="678">speed tables</text>

  <polyline class="ln" points="412,740 412,840 1300,840 1300,744" marker-end="url(#a)"/>
  <text class="lm" x="856" y="830">calibration.json (meter fit, driven-distance factor, app premium, intervals)</text>
</svg>
