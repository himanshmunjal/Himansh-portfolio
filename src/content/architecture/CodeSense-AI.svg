<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#222">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/>
    </marker>
    <style>
      .grp { fill: #f7f7f7; stroke: #c8c8c8; stroke-width: 1.5; }
      .glabel { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #666; }
      .box { fill: #ffffff; stroke: #222; stroke-width: 2; }
      .boxA { fill: #eaf2f5; stroke: #2f6f86; stroke-width: 2.5; }
      .t { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .s { font-size: 14px; text-anchor: middle; fill: #444; }
      .lbl { font-size: 14px; text-anchor: middle; fill: #222; }
      .lblL { font-size: 14px; text-anchor: start; fill: #222; }
      .lblA { font-size: 14px; text-anchor: middle; fill: #2f6f86; font-weight: 600; }
      .lblAL { font-size: 14px; text-anchor: start; fill: #2f6f86; font-weight: 600; }
      .ar { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#ah); }
      .arA { stroke: #2f6f86; stroke-width: 3; fill: none; marker-end: url(#ahA); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Groups -->
  <rect class="grp" x="20" y="60" width="150" height="820" rx="12"/>
  <text class="glabel" x="36" y="88">CLIENT</text>

  <rect class="grp" x="190" y="60" width="130" height="820" rx="12"/>
  <text class="glabel" x="206" y="88">API</text>

  <rect class="grp" x="340" y="60" width="1100" height="210" rx="12"/>
  <text class="glabel" x="356" y="88">INGESTION</text>

  <rect class="grp" x="340" y="320" width="1100" height="155" rx="12"/>
  <text class="glabel" x="356" y="348">STORAGE</text>

  <rect class="grp" x="340" y="525" width="1100" height="355" rx="12"/>
  <text class="glabel" x="356" y="553">QUERY</text>

  <rect class="grp" x="1460" y="60" width="125" height="820" rx="12"/>
  <text class="glabel" x="1476" y="88">OUTPUT</text>

  <!-- Client -->
  <rect class="box" x="35" y="120" width="120" height="110" rx="8"/>
  <text class="t" x="95" y="168">GitHub</text>
  <text class="t" x="95" y="190">repo</text>

  <rect class="boxA" x="35" y="645" width="120" height="110" rx="8"/>
  <text class="t" x="95" y="690">React UI</text>
  <text class="s" x="95" y="714">chat, sources,</text>
  <text class="s" x="95" y="732">impact graph</text>

  <!-- API -->
  <rect class="boxA" x="205" y="365" width="100" height="395" rx="8"/>
  <text class="t" x="255" y="530">FastAPI</text>
  <text class="s" x="255" y="558">/ingest</text>
  <text class="s" x="255" y="578">/query</text>
  <text class="s" x="255" y="598">/impact</text>
  <text class="s" x="255" y="618">/summarize</text>

  <!-- Ingestion -->
  <rect class="box" x="420" y="120" width="150" height="110" rx="8"/>
  <text class="t" x="495" y="168">Celery worker</text>
  <text class="s" x="495" y="192">clone, walk files</text>

  <rect class="box" x="660" y="120" width="140" height="110" rx="8"/>
  <text class="t" x="730" y="160">tree-sitter</text>
  <text class="t" x="730" y="182">parser</text>
  <text class="s" x="730" y="206">5 languages</text>

  <rect class="box" x="900" y="120" width="180" height="110" rx="8"/>
  <text class="t" x="990" y="158">Embedders</text>
  <text class="s" x="990" y="184">bge-small (384-d)</text>
  <text class="s" x="990" y="204">node2vec (128-d)</text>

  <!-- Storage -->
  <rect class="box" x="420" y="365" width="150" height="95" rx="8"/>
  <text class="t" x="495" y="403">Redis</text>
  <text class="s" x="495" y="427">job queue,</text>
  <text class="s" x="495" y="445">repo registry</text>

  <rect class="box" x="660" y="365" width="140" height="95" rx="8"/>
  <text class="t" x="730" y="408">Call graph</text>
  <text class="s" x="730" y="434">networkx .pkl</text>

  <rect class="box" x="880" y="365" width="160" height="95" rx="8"/>
  <text class="t" x="960" y="408">Qdrant</text>
  <text class="s" x="960" y="434">2 vectors per chunk</text>

  <!-- Query -->
  <rect class="boxA" x="420" y="640" width="130" height="120" rx="8"/>
  <text class="t" x="485" y="688">Query</text>
  <text class="t" x="485" y="710">classifier</text>
  <text class="s" x="485" y="734">LLM, 4 types</text>

  <rect class="boxA" x="640" y="640" width="400" height="120" rx="8"/>
  <text class="t" x="840" y="690">Retrievers</text>
  <text class="s" x="840" y="716">semantic search · graph traversal</text>
  <text class="s" x="840" y="736">· clustering (analytical)</text>

  <rect class="boxA" x="1110" y="640" width="125" height="120" rx="8"/>
  <text class="t" x="1172" y="692">Reranker</text>
  <text class="s" x="1172" y="716">MiniLM</text>
  <text class="s" x="1172" y="734">cross-encoder</text>

  <rect class="boxA" x="1290" y="640" width="130" height="120" rx="8"/>
  <text class="t" x="1355" y="692">Groq LLM</text>
  <text class="s" x="1355" y="716">gpt-oss-120b</text>
  <text class="s" x="1355" y="734">grounded</text>

  <!-- Output -->
  <rect class="boxA" x="1470" y="600" width="105" height="200" rx="8"/>
  <text class="t" x="1522" y="642">Cited</text>
  <text class="t" x="1522" y="664">answer</text>
  <text class="s" x="1522" y="694">answer text</text>
  <text class="s" x="1522" y="714">file:fn:line</text>
  <text class="s" x="1522" y="734">confidence</text>
  <text class="s" x="1522" y="754">sources_used</text>

  <!-- Ingestion arrows (dark) -->
  <line class="ar" x1="155" y1="175" x2="418" y2="175"/>
  <text class="lbl" x="287" y="161">git clone</text>

  <line class="ar" x1="305" y1="412" x2="418" y2="412"/>
  <text class="lbl" x="362" y="398">ingest task</text>

  <line class="ar" x1="495" y1="365" x2="495" y2="232"/>
  <text class="lblL" x="505" y="302">ingest job</text>

  <line class="ar" x1="570" y1="175" x2="658" y2="175"/>
  <text class="lbl" x="615" y="161">source</text>
  <text class="lbl" x="615" y="200">files</text>

  <line class="ar" x1="800" y1="175" x2="898" y2="175"/>
  <text class="lbl" x="850" y="161">chunks +</text>
  <text class="lbl" x="850" y="200">call edges</text>

  <line class="ar" x1="730" y1="230" x2="730" y2="363"/>
  <text class="lblL" x="740" y="302">DiGraph</text>

  <line class="ar" x1="990" y1="230" x2="990" y2="363"/>
  <text class="lblL" x="1000" y="302">vectors + payload</text>

  <!-- Query path (accent) -->
  <line class="arA" x1="155" y1="700" x2="203" y2="700"/>
  <text class="lblA" x="180" y="684">HTTP</text>

  <line class="arA" x1="305" y1="700" x2="418" y2="700"/>
  <text class="lblA" x="362" y="684">question</text>

  <line class="arA" x1="550" y1="700" x2="638" y2="700"/>
  <text class="lblA" x="595" y="684">query</text>
  <text class="lblA" x="595" y="726">type</text>

  <line class="arA" x1="1040" y1="700" x2="1108" y2="700"/>
  <text class="lblA" x="1075" y="684">top-K</text>

  <line class="arA" x1="1235" y1="700" x2="1288" y2="700"/>
  <text class="lblA" x="1262" y="684">top 5</text>

  <line class="arA" x1="1420" y1="700" x2="1468" y2="700"/>
  <text class="lblA" x="1445" y="684">JSON</text>

  <line class="arA" x1="730" y1="460" x2="730" y2="638"/>
  <text class="lblAL" x="740" y="595">callers / callees</text>

  <line class="arA" x1="960" y1="460" x2="960" y2="638"/>
  <text class="lblAL" x="970" y="595">nearest chunks</text>

  <!-- Response back to the user -->
  <path class="ar" d="M1522,800 L1522,840 L95,840 L95,757" stroke-dasharray="6 5"/>
  <text class="lbl" x="808" y="830">JSON response returned to the React UI via FastAPI</text>
</svg>
