<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d7a"/></marker>
    <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="45" y="52" font-size="28" font-weight="700" fill="#222">ExpKit architecture</text>
  <text x="45" y="80" font-size="16" fill="#555">Real Stack Overflow user behaviour, simulated assignment and effects: every method is checked before it is trusted</text>

  <!-- group bands -->
  <g fill="#f6f7f7" stroke="#d5d8d8" stroke-width="1.5">
    <rect x="25" y="105" width="250" height="690" rx="14"/>
    <rect x="350" y="105" width="575" height="690" rx="14"/>
    <rect x="1000" y="105" width="250" height="690" rx="14"/>
    <rect x="1325" y="105" width="250" height="690" rx="14"/>
  </g>
  <g font-size="15" font-weight="700" fill="#666" letter-spacing="1.5" text-anchor="middle">
    <text x="150" y="140">DATA</text>
    <text x="637" y="140">INGEST &amp; CACHE</text>
    <text x="1125" y="140">PROCESSING</text>
    <text x="1450" y="140">STORAGE &amp; OUTPUT</text>
  </g>

  <!-- boxes -->
  <g fill="#fff" stroke="#222" stroke-width="2">
    <rect x="45" y="200" width="210" height="100" rx="10"/>
    <rect x="45" y="420" width="210" height="100" rx="10" stroke-dasharray="7 5"/>
    <rect x="45" y="640" width="210" height="100" rx="10"/>
    <rect x="370" y="200" width="210" height="100" rx="10"/>
    <rect x="1020" y="200" width="210" height="100" rx="10"/>
    <rect x="1020" y="420" width="210" height="100" rx="10"/>
    <rect x="1020" y="640" width="210" height="100" rx="10"/>
    <rect x="1345" y="420" width="210" height="100" rx="10"/>
    <rect x="1345" y="640" width="210" height="100" rx="10"/>
    <!-- cylinders -->
    <path d="M695,210 a105,14 0 0,1 210,0 v84 a105,14 0 0,1 -210,0 z"/>
    <path d="M695,210 a105,14 0 0,0 210,0" fill="none"/>
    <path d="M1345,210 a105,14 0 0,1 210,0 v84 a105,14 0 0,1 -210,0 z"/>
    <path d="M1345,210 a105,14 0 0,0 210,0" fill="none"/>
  </g>
  <!-- accent strip on main-path boxes -->
  <g fill="#2f7d7a">
    <rect x="45" y="200" width="6" height="100" rx="3"/>
    <rect x="370" y="200" width="6" height="100" rx="3"/>
    <rect x="1020" y="200" width="6" height="100" rx="3"/>
    <rect x="1345" y="420" width="6" height="100" rx="3"/>
  </g>

  <g text-anchor="middle" fill="#222">
    <g font-size="18" font-weight="700">
      <text x="150" y="236">Stack Overflow</text><text x="150" y="262">on BigQuery</text>
      <text x="150" y="462">Synthetic twin</text>
      <text x="150" y="680">Experiment data</text><text x="150" y="702">+ config</text>
      <text x="475" y="246">SQL extract</text>
      <text x="800" y="250">Parquet cache</text>
      <text x="1125" y="246">Simulation harness</text>
      <text x="1125" y="456">Method registry</text>
      <text x="1125" y="676">Analysis facade</text>
      <text x="1450" y="250">Results files</text>
      <text x="1450" y="462">Validation report</text>
      <text x="1450" y="682">Interfaces</text>
    </g>
    <g font-size="14" fill="#555">
      <text x="150" y="285">public dataset</text>
      <text x="150" y="486">same schema, offline</text>
      <text x="150" y="724">assigned users, TOML</text>
      <text x="475" y="272">data/extract.sql</text>
      <text x="800" y="276">177,441 users</text>
      <text x="1125" y="272">A/A + injected lift</text>
      <text x="1125" y="480">Welch · CUPED · jackknife</text>
      <text x="1125" y="500">OBF · mSPRT · SRM</text>
      <text x="1125" y="700">SRM gate → tests</text>
      <text x="1125" y="720">→ decision rules</text>
      <text x="1450" y="276">results/*.csv</text>
      <text x="1450" y="486">9 charts, report.html</text>
      <text x="1450" y="706">CLI · REST API</text>
      <text x="1450" y="726">Streamlit app</text>
    </g>
  </g>

  <!-- main validation path -->
  <g stroke="#2f7d7a" stroke-width="3" fill="none" marker-end="url(#ha)">
    <line x1="255" y1="250" x2="366" y2="250"/>
    <line x1="580" y1="250" x2="691" y2="250"/>
    <line x1="905" y1="250" x2="1016" y2="250"/>
    <line x1="1230" y1="250" x2="1341" y2="250"/>
    <line x1="1450" y1="310" x2="1450" y2="416"/>
  </g>
  <!-- synthetic stand-in -->
  <path d="M255,470 H960 V285 H1016" stroke="#777" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#hg)"/>
  <!-- registry calls and analysis path -->
  <g stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#hd)">
    <line x1="1095" y1="304" x2="1095" y2="416"/>
    <line x1="1155" y1="416" x2="1155" y2="304"/>
    <line x1="1095" y1="636" x2="1095" y2="524"/>
    <line x1="1155" y1="524" x2="1155" y2="636"/>
    <line x1="255" y1="690" x2="1016" y2="690"/>
    <line x1="1230" y1="690" x2="1341" y2="690"/>
  </g>

  <!-- arrow labels -->
  <g font-size="14" fill="#222" text-anchor="middle">
    <text x="312" y="218">SQL query</text><text x="312" y="236">at date T0</text>
    <text x="637" y="218">one row</text><text x="637" y="236">per user</text>
    <text x="962" y="218">pre/post</text><text x="962" y="236">metrics</text>
    <text x="1287" y="218">runs and</text><text x="1287" y="236">summaries</text>
    <text x="607" y="460" fill="#555">synthetic rows (CI, no credentials)</text>
    <text x="637" y="680">assigned data + TOML config</text>
    <text x="1287" y="658">readout</text><text x="1287" y="676">MD · JSON</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="1460" y="368">summary CSVs</text>
    <text x="1087" y="366" text-anchor="end">arrays</text>
    <text x="1163" y="366">TestResult</text>
    <text x="1087" y="586" text-anchor="end">arrays</text>
    <text x="1163" y="586">TestResult</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#222">
    <line x1="45" y1="833" x2="95" y2="833" stroke="#2f7d7a" stroke-width="3" marker-end="url(#ha)"/>
    <text x="108" y="838">validation path (make experiments)</text>
    <line x1="420" y1="833" x2="470" y2="833" stroke="#222" stroke-width="2.5" marker-end="url(#hd)"/>
    <text x="483" y="838">analysis path (expkit analyze)</text>
    <line x1="760" y1="833" x2="810" y2="833" stroke="#777" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#hg)"/>
    <text x="823" y="838">offline stand-in</text>
    <text x="45" y="872" fill="#555">Shipped as a pip package. The Docker image serves the REST API. GitHub Actions runs lint, the tests and every experiment on synthetic data.</text>
  </g>
</svg>
