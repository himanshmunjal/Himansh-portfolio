<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d7ea6"/>
    </marker>
    <style>
      .panel { fill: #f6f6f4; stroke: #d6d6d2; stroke-width: 1.5; }
      .ptitle { font-size: 16px; font-weight: 700; fill: #222; letter-spacing: 1.5px; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; }
      .main { fill: #eef4f8; stroke: #222; stroke-width: 2; }
      .name { font-size: 18px; font-weight: 700; fill: #222; text-anchor: middle; }
      .sub { font-size: 14px; fill: #222; text-anchor: middle; }
      .lbl { font-size: 14px; fill: #222; text-anchor: middle; }
      .lbla { font-size: 14px; fill: #2d6a8f; text-anchor: middle; font-weight: 600; }
      .bg { fill: #fff; }
      .flow { fill: none; stroke: #3d7ea6; stroke-width: 3; }
      .arr { fill: none; stroke: #222; stroke-width: 2; }
      .opt { fill: none; stroke: #222; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <!-- title -->
  <text x="40" y="62" font-size="28" font-weight="700" fill="#222">OSS Contributor Analytics</text>
  <text x="40" y="92" font-size="16" fill="#222">Batch pipeline from public GitHub events to first-time contributor retention estimates</text>

  <!-- panels -->
  <rect class="panel" x="30" y="120" width="215" height="350" rx="12"/>
  <text class="ptitle" x="50" y="152">SOURCES</text>
  <rect class="panel" x="310" y="120" width="935" height="310" rx="12"/>
  <text class="ptitle" x="330" y="152">PROCESSING</text>
  <rect class="panel" x="310" y="490" width="935" height="290" rx="12"/>
  <text class="ptitle" x="330" y="522">STORAGE</text>
  <rect class="panel" x="1320" y="410" width="250" height="370" rx="12"/>
  <text class="ptitle" x="1340" y="442">OUTPUTS</text>

  <!-- ===== arrows (drawn first, boxes on top) ===== -->

  <!-- sources -> adapters -->
  <path class="opt" d="M225,202 H290 V258 H336" marker-end="url(#ah)"/>
  <path class="flow" d="M225,300 L336,300" marker-end="url(#aa)"/>
  <path class="opt" d="M225,400 H290 V342 H336" marker-end="url(#ah)"/>

  <!-- adapters -> raw -->
  <path class="flow" d="M475,357 L540,574" marker-end="url(#aa)"/>
  <!-- raw -> sql -->
  <path class="flow" d="M620,574 L685,357" marker-end="url(#aa)"/>
  <!-- sql -> exports -->
  <path class="flow" d="M765,357 L830,574" marker-end="url(#aa)"/>
  <!-- exports -> analysis -->
  <path class="flow" d="M910,574 L975,357" marker-end="url(#aa)"/>
  <!-- analysis -> reports -->
  <path class="flow" d="M1055,357 L1120,574" marker-end="url(#aa)"/>

  <!-- reports -> outputs -->
  <path class="arr" d="M1230,600 L1346,490" marker-end="url(#ah)"/>
  <path class="arr" d="M1230,640 L1346,590" marker-end="url(#ah)"/>
  <path class="arr" d="M1230,688 L1346,695" marker-end="url(#ah)"/>
  <!-- exports -> api (routed below storage lane) -->
  <path class="arr" d="M870,712 L870,830 L1445,830 L1445,737" marker-end="url(#ah)"/>

  <!-- ===== arrow labels ===== -->
  <text class="lbl" x="257" y="194">rows</text>
  <text class="lbla" x="260" y="291">.json.gz</text>
  <text class="lbl" x="257" y="420">files</text>

  <rect class="bg" x="440" y="440" width="96" height="42"/>
  <text class="lbla" x="488" y="457">normalized</text><text class="lbla" x="488" y="475">events</text>
  <rect class="bg" x="608" y="440" width="96" height="42"/>
  <text class="lbla" x="656" y="457">raw/*.parquet</text><text class="lbla" x="656" y="475">reads</text>
  <rect class="bg" x="736" y="440" width="88" height="42"/>
  <text class="lbla" x="780" y="457">fact</text><text class="lbla" x="780" y="475">tables</text>
  <rect class="bg" x="895" y="440" width="96" height="42"/>
  <text class="lbla" x="943" y="457">contributor</text><text class="lbla" x="943" y="475">rows</text>
  <rect class="bg" x="1032" y="440" width="104" height="42"/>
  <text class="lbla" x="1084" y="457">estimates,</text><text class="lbla" x="1084" y="475">figures</text>

  <rect class="bg" x="1248" y="540" width="70" height="22"/><text class="lbl" x="1283" y="556">JSON, CSV</text>
  <rect class="bg" x="1248" y="607" width="70" height="22"/><text class="lbl" x="1283" y="623">JSON, CSV</text>
  <rect class="bg" x="1248" y="666" width="70" height="22"/><text class="lbl" x="1283" y="682">JSON, CSV</text>
  <rect class="bg" x="1060" y="819" width="150" height="22"/><text class="lbl" x="1135" y="835">fct_* parquet tables</text>

  <!-- ===== Sources ===== -->
  <rect class="box" x="45" y="172" width="180" height="60" rx="8"/>
  <text class="name" x="135" y="198">BigQuery</text>
  <text class="sub" x="135" y="219">optional, cost-capped</text>

  <rect class="main" x="45" y="260" width="180" height="80" rx="8"/>
  <text class="name" x="135" y="292">GH Archive</text>
  <text class="sub" x="135" y="313">hourly event dumps</text>
  <text class="sub" x="135" y="330">Jan–Mar 2015</text>

  <rect class="box" x="45" y="370" width="180" height="60" rx="8"/>
  <text class="name" x="135" y="396">Own parquet</text>
  <text class="sub" x="135" y="417">same event schema</text>

  <!-- ===== Processing ===== -->
  <rect class="main" x="340" y="245" width="190" height="110" rx="8"/>
  <text class="name" x="435" y="283">Source adapters</text>
  <text class="sub" x="435" y="307">parse, keep 6 types</text>
  <text class="sub" x="435" y="326">resumable, per hour</text>

  <rect class="main" x="630" y="245" width="190" height="110" rx="8"/>
  <text class="name" x="725" y="283">SQL layers</text>
  <text class="sub" x="725" y="307">DuckDB, 8 .sql files</text>
  <text class="sub" x="725" y="326">dedupe, bots, returns</text>

  <rect class="main" x="920" y="245" width="190" height="110" rx="8"/>
  <text class="name" x="1015" y="283">Analysis stage</text>
  <text class="sub" x="1015" y="307">funnel, KM, Cox,</text>
  <text class="sub" x="1015" y="326">PSM, scorecard</text>

  <!-- ===== Storage (cylinders) ===== -->
  <g>
    <path class="main" d="M490,592 a90,14 0 0 1 180,0 v104 a90,14 0 0 1 -180,0 z"/>
    <path fill="none" stroke="#222" stroke-width="2" d="M490,592 a90,14 0 0 0 180,0"/>
    <text class="name" x="580" y="640">Raw events</text>
    <text class="sub" x="580" y="662">parquet, 1 file/hour</text>
    <text class="sub" x="580" y="681">17-column contract</text>
  </g>
  <g>
    <path class="main" d="M780,592 a90,14 0 0 1 180,0 v104 a90,14 0 0 1 -180,0 z"/>
    <path fill="none" stroke="#222" stroke-width="2" d="M780,592 a90,14 0 0 0 180,0"/>
    <text class="name" x="870" y="640">Fact tables</text>
    <text class="sub" x="870" y="662">warehouse.duckdb +</text>
    <text class="sub" x="870" y="681">data/out/*.parquet</text>
  </g>
  <g>
    <path class="main" d="M1050,592 a90,14 0 0 1 180,0 v104 a90,14 0 0 1 -180,0 z"/>
    <path fill="none" stroke="#222" stroke-width="2" d="M1050,592 a90,14 0 0 0 180,0"/>
    <text class="name" x="1140" y="640">Reports</text>
    <text class="sub" x="1140" y="662">results.json,</text>
    <text class="sub" x="1140" y="681">CSVs, PNGs</text>
  </g>

  <!-- ===== Outputs ===== -->
  <rect class="box" x="1350" y="455" width="190" height="70" rx="8"/>
  <text class="name" x="1445" y="485">HTML dashboard</text>
  <text class="sub" x="1445" y="507">one static file</text>

  <rect class="box" x="1350" y="555" width="190" height="70" rx="8"/>
  <text class="name" x="1445" y="585">Streamlit app</text>
  <text class="sub" x="1445" y="607">local, read-only</text>

  <rect class="box" x="1350" y="655" width="190" height="80" rx="8"/>
  <text class="name" x="1445" y="690">JSON API</text>
  <text class="sub" x="1445" y="712">FastAPI, read-only</text>

  <!-- ===== legend + footer ===== -->
  <line x1="50" y1="560" x2="100" y2="560" stroke="#3d7ea6" stroke-width="3" marker-end="url(#aa)"/>
  <text x="112" y="565" font-size="14" fill="#222">main data path</text>
  <line x1="50" y1="595" x2="100" y2="595" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
  <text x="112" y="600" font-size="14" fill="#222">optional source</text>
  <line x1="50" y1="630" x2="100" y2="630" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
  <text x="112" y="635" font-size="14" fill="#222">read by front end</text>

  <text x="40" y="878" font-size="15" fill="#222">Each stage is a CLI command (extract, build, sanity, report) driven by one YAML config; make all runs them in order.</text>
</svg>
