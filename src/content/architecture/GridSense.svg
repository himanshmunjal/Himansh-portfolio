<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#222">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d7a8a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="52" font-size="26" font-weight="700">GridSense: architecture</text>
  <line x1="1110" y1="45" x2="1160" y2="45" stroke="#3d7a8a" stroke-width="3"/>
  <text x="1172" y="50" font-size="15">forecast path</text>
  <line x1="1310" y1="45" x2="1360" y2="45" stroke="#222" stroke-width="1.6"/>
  <text x="1372" y="50" font-size="15">anomaly and inputs</text>

  <!-- Groups -->
  <g fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 5">
    <rect x="30" y="120" width="190" height="640" rx="10"/>
    <rect x="290" y="120" width="210" height="640" rx="10"/>
    <rect x="570" y="120" width="260" height="640" rx="10"/>
    <rect x="900" y="120" width="180" height="640" rx="10"/>
    <rect x="1150" y="120" width="180" height="640" rx="10"/>
    <rect x="1400" y="120" width="170" height="640" rx="10"/>
  </g>
  <g font-size="15" font-weight="700" letter-spacing="1.5">
    <text x="46" y="150">INPUT</text>
    <text x="306" y="150">PREPARE</text>
    <text x="586" y="150">MODELS</text>
    <text x="916" y="150">STORAGE</text>
    <text x="1166" y="150">SERVING</text>
    <text x="1416" y="150">OUTPUT</text>
  </g>

  <!-- Boxes -->
  <g fill="#ffffff" stroke="#222" stroke-width="1.8">
    <rect x="45" y="230" width="160" height="120" rx="8"/>
    <rect x="45" y="520" width="160" height="120" rx="8"/>
    <rect x="305" y="230" width="180" height="120" rx="8"/>
    <rect x="305" y="520" width="180" height="120" rx="8"/>
    <rect x="585" y="200" width="230" height="110" rx="8"/>
    <rect x="585" y="400" width="230" height="110" rx="8"/>
    <rect x="585" y="600" width="230" height="110" rx="8"/>
    <rect x="915" y="200" width="150" height="510" rx="8"/>
    <rect x="1165" y="330" width="150" height="240" rx="8"/>
    <rect x="1415" y="330" width="140" height="240" rx="8"/>
  </g>

  <!-- Input -->
  <text x="125" y="272" font-size="17" font-weight="700" text-anchor="middle">UCI meter</text>
  <text x="125" y="294" font-size="17" font-weight="700" text-anchor="middle">readings</text>
  <text x="125" y="320" font-size="14" text-anchor="middle">370 clients, 15 min</text>
  <text x="125" y="560" font-size="17" font-weight="700" text-anchor="middle">Lisbon weather</text>
  <text x="125" y="582" font-size="17" font-weight="700" text-anchor="middle">and holidays</text>
  <text x="125" y="608" font-size="14" text-anchor="middle">Open-Meteo, PT</text>

  <!-- Prepare -->
  <text x="395" y="275" font-size="17" font-weight="700" text-anchor="middle">Zone builder</text>
  <text x="395" y="300" font-size="14" text-anchor="middle">309 clients, 4 zones</text>
  <text x="395" y="320" font-size="14" text-anchor="middle">injected anomalies</text>
  <text x="395" y="562" font-size="17" font-weight="700" text-anchor="middle">Feature pipeline</text>
  <text x="395" y="587" font-size="14" text-anchor="middle">lags, calendar, temp</text>
  <text x="395" y="607" font-size="14" text-anchor="middle">70/15/15 by time</text>

  <!-- Models -->
  <text x="700" y="242" font-size="17" font-weight="700" text-anchor="middle">LSTM forecaster</text>
  <text x="700" y="267" font-size="14" text-anchor="middle">encoder-decoder,</text>
  <text x="700" y="287" font-size="14" text-anchor="middle">MC Dropout bands</text>
  <text x="700" y="442" font-size="17" font-weight="700" text-anchor="middle">LightGBM forecaster</text>
  <text x="700" y="467" font-size="14" text-anchor="middle">same windows,</text>
  <text x="700" y="487" font-size="14" text-anchor="middle">all 24 horizons</text>
  <text x="700" y="642" font-size="17" font-weight="700" text-anchor="middle">Anomaly autoencoder</text>
  <text x="700" y="667" font-size="14" text-anchor="middle">LSTM, normal load only,</text>
  <text x="700" y="687" font-size="14" text-anchor="middle">per-hour error</text>

  <!-- Storage -->
  <text x="990" y="420" font-size="17" font-weight="700" text-anchor="middle">Saved models</text>
  <text x="990" y="446" font-size="14" text-anchor="middle">weights, blend</text>
  <text x="990" y="466" font-size="14" text-anchor="middle">weight, band</text>
  <text x="990" y="486" font-size="14" text-anchor="middle">widths, thresholds</text>

  <!-- Serving -->
  <text x="1240" y="420" font-size="17" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="1240" y="442" font-size="17" font-weight="700" text-anchor="middle">service</text>
  <text x="1240" y="468" font-size="14" text-anchor="middle">blend + bands,</text>
  <text x="1240" y="488" font-size="14" text-anchor="middle">score each hour</text>

  <!-- Output -->
  <text x="1485" y="420" font-size="17" font-weight="700" text-anchor="middle">React</text>
  <text x="1485" y="442" font-size="17" font-weight="700" text-anchor="middle">dashboard</text>
  <text x="1485" y="468" font-size="14" text-anchor="middle">forecast chart,</text>
  <text x="1485" y="488" font-size="14" text-anchor="middle">anomaly feed</text>

  <!-- Input -> prepare -->
  <line x1="205" y1="290" x2="301" y2="290" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="255" y="262" font-size="14" text-anchor="middle">hourly</text>
  <text x="255" y="280" font-size="14" text-anchor="middle">kWh</text>
  <line x1="205" y1="580" x2="301" y2="580" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="255" y="552" font-size="14" text-anchor="middle">temp,</text>
  <text x="255" y="570" font-size="14" text-anchor="middle">holidays</text>
  <line x1="395" y1="350" x2="395" y2="516" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="407" y="440" font-size="14">zone CSVs</text>

  <!-- Feature pipeline -> models (bus) -->
  <polyline points="485,580 535,580 535,255 581,255" fill="none" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <polyline points="535,455 581,455" fill="none" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <polyline points="535,580 535,655 581,655" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="535" y="190" font-size="14" text-anchor="middle">training</text>
  <text x="535" y="208" font-size="14" text-anchor="middle">windows</text>

  <!-- Models -> saved -->
  <line x1="815" y1="255" x2="911" y2="255" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="865" y="243" font-size="14" text-anchor="middle">weights</text>
  <line x1="815" y1="455" x2="911" y2="455" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="865" y="443" font-size="14" text-anchor="middle">model</text>
  <line x1="815" y1="655" x2="911" y2="655" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="865" y="643" font-size="14" text-anchor="middle">threshold</text>

  <!-- Saved -> API -> dashboard -->
  <line x1="1065" y1="450" x2="1161" y2="450" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="1115" y="420" font-size="14" text-anchor="middle">loaded</text>
  <text x="1115" y="438" font-size="14" text-anchor="middle">at start</text>
  <line x1="1315" y1="410" x2="1411" y2="410" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="1365" y="398" font-size="14" text-anchor="middle">JSON</text>
  <line x1="1415" y1="510" x2="1319" y2="510" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="1365" y="498" font-size="14" text-anchor="middle">GET</text>

  <text x="800" y="820" font-size="16" text-anchor="middle">Endpoints: /forecast (24h blend + 95% band), /anomalies (spike or dropout, severity), /zones, /health</text>
</svg>
