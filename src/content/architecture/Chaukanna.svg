<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#222">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d7a8a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title + legend -->
  <text x="40" y="52" font-size="26" font-weight="700">Chaukanna: architecture</text>
  <line x1="1110" y1="45" x2="1160" y2="45" stroke="#3d7a8a" stroke-width="3"/>
  <text x="1172" y="50" font-size="15">live call path</text>
  <line x1="1310" y1="45" x2="1360" y2="45" stroke="#222" stroke-width="1.6"/>
  <text x="1372" y="50" font-size="15">state, alerts, storage</text>

  <!-- Layer boxes -->
  <g fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 5">
    <rect x="40" y="290" width="195" height="410" rx="10"/>
    <rect x="310" y="90" width="970" height="160" rx="10"/>
    <rect x="310" y="290" width="970" height="410" rx="10"/>
    <rect x="310" y="725" width="970" height="150" rx="10"/>
    <rect x="1330" y="90" width="245" height="560" rx="10"/>
  </g>
  <g font-size="15" font-weight="700" letter-spacing="1.5">
    <text x="58" y="320">CALL INPUT</text>
    <text x="830" y="120">SPEECH IN (GNANI)</text>
    <text x="830" y="320">GO BACKEND (ONE BINARY)</text>
    <text x="1050" y="755">SPEECH OUT, REASONING</text>
    <text x="1350" y="120">STORAGE, OUTPUT</text>
  </g>

  <!-- Components -->
  <g fill="#ffffff" stroke="#222" stroke-width="1.8">
    <rect x="55" y="345" width="160" height="135" rx="8"/>
    <rect x="55" y="530" width="160" height="135" rx="8"/>
    <rect x="340" y="135" width="420" height="97" rx="8"/>
    <rect x="340" y="345" width="180" height="315" rx="8"/>
    <rect x="570" y="345" width="190" height="105" rx="8"/>
    <rect x="570" y="530" width="190" height="105" rx="8"/>
    <rect x="820" y="530" width="190" height="105" rx="8"/>
    <rect x="1060" y="345" width="190" height="105" rx="8"/>
    <rect x="1060" y="530" width="190" height="105" rx="8"/>
    <rect x="340" y="770" width="300" height="85" rx="8"/>
    <rect x="800" y="770" width="230" height="85" rx="8"/>
    <rect x="1355" y="135" width="200" height="97" rx="8"/>
    <rect x="1355" y="345" width="200" height="105" rx="8"/>
    <rect x="1355" y="530" width="200" height="105" rx="8"/>
  </g>

  <!-- Call input -->
  <text x="135" y="395" font-size="19" font-weight="700" text-anchor="middle">Exotel / Twilio</text>
  <text x="135" y="421" font-size="14" text-anchor="middle">virtual number</text>
  <text x="135" y="441" font-size="14" text-anchor="middle">merged into call</text>
  <text x="135" y="575" font-size="19" font-weight="700" text-anchor="middle">Speakerphone</text>
  <text x="135" y="599" font-size="19" font-weight="700" text-anchor="middle">browser</text>
  <text x="135" y="625" font-size="14" text-anchor="middle">mic beside call</text>

  <!-- Prisma -->
  <text x="550" y="175" font-size="19" font-weight="700" text-anchor="middle">Prisma STT</text>
  <text x="550" y="201" font-size="14" text-anchor="middle">streaming, 8 kHz, 10 languages, scam keyterms</text>

  <!-- Backend -->
  <text x="430" y="480" font-size="18" font-weight="700" text-anchor="middle">Media stream</text>
  <text x="430" y="503" font-size="18" font-weight="700" text-anchor="middle">handler</text>
  <text x="430" y="529" font-size="14" text-anchor="middle">WebSocket audio</text>
  <text x="430" y="549" font-size="14" text-anchor="middle">reconnects Prisma</text>

  <text x="665" y="385" font-size="18" font-weight="700" text-anchor="middle">Call session</text>
  <text x="665" y="410" font-size="14" text-anchor="middle">transcript, risk</text>
  <text x="665" y="430" font-size="14" text-anchor="middle">state machine</text>

  <text x="665" y="570" font-size="18" font-weight="700" text-anchor="middle">Pre-filter</text>
  <text x="665" y="595" font-size="14" text-anchor="middle">Indic phrases,</text>
  <text x="665" y="615" font-size="14" text-anchor="middle">direct demands</text>

  <text x="915" y="570" font-size="18" font-weight="700" text-anchor="middle">Response logic</text>
  <text x="915" y="595" font-size="14" text-anchor="middle">caution, warn,</text>
  <text x="915" y="615" font-size="14" text-anchor="middle">interrupt, reply</text>

  <text x="1155" y="385" font-size="18" font-weight="700" text-anchor="middle">Dashboard hub</text>
  <text x="1155" y="410" font-size="14" text-anchor="middle">WebSocket</text>
  <text x="1155" y="430" font-size="14" text-anchor="middle">per owner</text>

  <text x="1155" y="570" font-size="18" font-weight="700" text-anchor="middle">Alert service</text>
  <text x="1155" y="595" font-size="14" text-anchor="middle">Telegram, WhatsApp,</text>
  <text x="1155" y="615" font-size="14" text-anchor="middle">SMS fallback</text>

  <!-- Speech out, reasoning -->
  <text x="490" y="806" font-size="19" font-weight="700" text-anchor="middle">Timbre TTS</text>
  <text x="490" y="831" font-size="14" text-anchor="middle">pre-made warning clips, 10 languages</text>
  <text x="915" y="806" font-size="19" font-weight="700" text-anchor="middle">Reasoning LLM</text>
  <text x="915" y="831" font-size="14" text-anchor="middle">optional, Evon 30B target</text>

  <!-- Output -->
  <text x="1455" y="175" font-size="18" font-weight="700" text-anchor="middle">SQLite / Postgres</text>
  <text x="1455" y="201" font-size="14" text-anchor="middle">encrypted at rest</text>
  <text x="1455" y="385" font-size="18" font-weight="700" text-anchor="middle">Family dashboard</text>
  <text x="1455" y="410" font-size="14" text-anchor="middle">React + Tailwind</text>
  <text x="1455" y="430" font-size="14" text-anchor="middle">Step In, mark safe</text>
  <text x="1455" y="570" font-size="18" font-weight="700" text-anchor="middle">Family phone</text>
  <text x="1455" y="595" font-size="14" text-anchor="middle">Telegram alert</text>
  <text x="1455" y="615" font-size="14" text-anchor="middle">with call link</text>

  <!-- Input <-> handler -->
  <line x1="217" y1="412" x2="338" y2="412" stroke="#3d7a8a" stroke-width="3" marker-start="url(#aa)" marker-end="url(#aa)"/>
  <text x="272" y="380" font-size="14" text-anchor="middle">8 kHz</text><text x="272" y="398" font-size="14" text-anchor="middle">audio</text>
  <line x1="217" y1="597" x2="338" y2="597" stroke="#222" stroke-width="1.6" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="272" y="565" font-size="14" text-anchor="middle">mic</text><text x="272" y="583" font-size="14" text-anchor="middle">audio</text>

  <!-- handler -> Prisma -> session -->
  <line x1="430" y1="345" x2="430" y2="236" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="442" y="275" font-size="14">audio frames</text>
  <line x1="665" y1="232" x2="665" y2="341" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="653" y="276" font-size="14" text-anchor="end">final transcripts</text>

  <!-- session -> pre-filter -> response logic -->
  <line x1="665" y1="450" x2="665" y2="526" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="677" y="494" font-size="14">each line</text>
  <line x1="760" y1="582" x2="816" y2="582" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="790" y="572" font-size="14" text-anchor="middle">flags</text>

  <!-- session -> hub -> dashboard -->
  <line x1="760" y1="397" x2="1056" y2="397" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="908" y="387" font-size="14" text-anchor="middle">live transcript, risk, red flags</text>
  <line x1="1250" y1="397" x2="1351" y2="397" stroke="#222" stroke-width="1.6" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="1305" y="387" font-size="14" text-anchor="middle">events</text>

  <!-- session -> store -->
  <polyline points="740,345 740,272 1455,272 1455,236" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="1090" y="264" font-size="14" text-anchor="middle">calls, flagged transcripts, people</text>

  <!-- response -> alert -> family -->
  <line x1="1010" y1="582" x2="1056" y2="582" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="1034" y="572" font-size="14" text-anchor="middle">alert</text>
  <line x1="1250" y1="582" x2="1351" y2="582" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="1305" y="572" font-size="14" text-anchor="middle">alert</text>

  <!-- response <-> LLM -->
  <line x1="890" y1="635" x2="890" y2="766" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="880" y="712" font-size="14" text-anchor="end">rolling window</text>
  <line x1="950" y1="770" x2="950" y2="639" stroke="#222" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="962" y="712" font-size="14">risk, flags, reason</text>

  <!-- response -> Timbre -> handler (warning loop) -->
  <polyline points="840,635 840,690 590,690 590,766" fill="none" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="715" y="680" font-size="14" text-anchor="middle">pre-written line</text>
  <line x1="430" y1="770" x2="430" y2="664" stroke="#3d7a8a" stroke-width="3" marker-end="url(#aa)"/>
  <text x="442" y="712" font-size="14">warning audio</text>
</svg>
