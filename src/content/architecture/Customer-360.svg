<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6ea5"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="35" y="52" font-size="26" font-weight="700" fill="#222">Customer 360: incremental warehouse on real Olist data</text>

  <!-- group panels -->
  <g fill="#f5f5f3">
    <rect x="25" y="85" width="200" height="760" rx="10"/>
    <rect x="315" y="85" width="220" height="760" rx="10"/>
    <rect x="625" y="85" width="220" height="760" rx="10"/>
    <rect x="935" y="85" width="320" height="760" rx="10"/>
    <rect x="1335" y="85" width="240" height="760" rx="10"/>
  </g>
  <g font-size="15" font-weight="700" fill="#666" letter-spacing="1.5" text-anchor="middle">
    <text x="125" y="112">SOURCE</text>
    <text x="425" y="112">LANDING</text>
    <text x="735" y="112">PROCESSING</text>
    <text x="1095" y="112">STORAGE</text>
    <text x="1455" y="112">OUTPUT</text>
  </g>

  <!-- Postgres warehouse panel -->
  <rect x="950" y="130" width="290" height="530" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1095" y="160" font-size="19" font-weight="700" fill="#222" text-anchor="middle">Postgres warehouse</text>

  <!-- boxes -->
  <g fill="#ffffff" stroke="#222" stroke-width="2">
    <rect x="35" y="165" width="180" height="95" rx="8"/>
    <rect x="325" y="165" width="200" height="95" rx="8"/>
    <rect x="325" y="345" width="200" height="95" rx="8"/>
    <rect x="635" y="185" width="200" height="255" rx="8"/>
    <rect x="635" y="720" width="200" height="100" rx="8"/>
    <rect x="965" y="180" width="260" height="60" rx="6"/>
    <rect x="965" y="280" width="260" height="60" rx="6"/>
    <rect x="965" y="375" width="260" height="65" rx="6"/>
    <rect x="1005" y="470" width="220" height="60" rx="6"/>
    <rect x="965" y="580" width="260" height="60" rx="6"/>
    <rect x="945" y="720" width="225" height="100" rx="8"/>
    <rect x="1345" y="455" width="220" height="80" rx="8"/>
    <rect x="1345" y="575" width="220" height="80" rx="8"/>
    <rect x="1345" y="720" width="220" height="100" rx="8"/>
  </g>

  <g fill="#222" text-anchor="middle">
    <g font-size="19" font-weight="700">
      <text x="125" y="205">Olist dataset</text>
      <text x="425" y="205">Landing simulator</text>
      <text x="425" y="385">Landing files</text>
      <text x="735" y="225">Incremental ingest</text>
      <text x="735" y="760">BigQuery pipeline</text>
      <text x="1095" y="207">raw (bronze)</text>
      <text x="1095" y="307">silver</text>
      <text x="1095" y="402">dw star schema</text>
      <text x="1115" y="497">mart views</text>
      <text x="1095" y="607">ml schema</text>
      <text x="1057" y="760">BigQuery (emulator)</text>
      <text x="1455" y="490">Streamlit dashboard</text>
      <text x="1455" y="610">Bad-review model</text>
      <text x="1455" y="760">Parity check</text>
    </g>
    <g font-size="15" fill="#555">
      <text x="125" y="232">Kaggle, 99,441 orders</text>
      <text x="425" y="232">build_landing.py</text>
      <text x="425" y="412">backfill + 116 days</text>
      <text x="735" y="265">pipeline/ingest.py</text>
      <text x="735" y="300">checksum per file</text>
      <text x="735" y="335">one transaction per run</text>
      <text x="735" y="370">touched keys only</text>
      <text x="735" y="405">replays are no-ops</text>
      <text x="735" y="787">bq_run.py</text>
      <text x="1095" y="228">append-only, batch-tagged</text>
      <text x="1095" y="328">current row per key</text>
      <text x="1095" y="425">SCD2 dim_customer + facts</text>
      <text x="1115" y="518">customer_360, funnels</text>
      <text x="1095" y="628">features + risk scores</text>
      <text x="1057" y="787">partitioned, clustered</text>
      <text x="1455" y="515">6 pages</text>
      <text x="1455" y="635">logistic regression</text>
      <text x="1455" y="787">7 tables, same values</text>
    </g>
  </g>

  <!-- main data path (accent) -->
  <g stroke="#3b6ea5" stroke-width="3" fill="none" marker-end="url(#m)">
    <line x1="215" y1="212" x2="323" y2="212"/>
    <line x1="425" y1="260" x2="425" y2="343"/>
    <line x1="525" y1="392" x2="633" y2="392"/>
    <line x1="835" y1="210" x2="963" y2="210"/>
    <line x1="1095" y1="240" x2="1095" y2="278"/>
    <line x1="1095" y1="340" x2="1095" y2="373"/>
    <line x1="1115" y1="440" x2="1115" y2="468"/>
    <line x1="1225" y1="500" x2="1343" y2="500"/>
  </g>

  <!-- secondary paths -->
  <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a)">
    <polyline points="985,440 985,578"/>
    <line x1="1225" y1="600" x2="1343" y2="600"/>
    <line x1="1345" y1="628" x2="1227" y2="628"/>
    <polyline points="425,440 425,770 633,770"/>
    <line x1="835" y1="770" x2="943" y2="770"/>
    <polyline points="1205,660 1205,745 1343,745"/>
    <line x1="1170" y1="795" x2="1343" y2="795"/>
  </g>

  <!-- arrow labels -->
  <g font-size="15" fill="#222">
    <text x="270" y="200" text-anchor="middle">9 CSV tables</text>
    <text x="435" y="307">daily extracts</text>
    <text x="580" y="380" text-anchor="middle">CSV batches</text>
    <text x="900" y="198" text-anchor="middle">COPY rows</text>
    <text x="1110" y="265">touched keys</text>
    <text x="1110" y="362">SCD2 + upserts</text>
    <text x="1130" y="460">views</text>
    <text x="995" y="560">features</text>
    <text x="1285" y="488" text-anchor="middle">SQL reads</text>
    <text x="1285" y="590" text-anchor="middle">features</text>
    <text x="1285" y="648" text-anchor="middle">risk scores</text>
    <text x="530" y="758" text-anchor="middle">sample batches</text>
    <text x="889" y="758" text-anchor="middle">SQL jobs</text>
    <text x="1275" y="735" text-anchor="middle">dw tables</text>
    <text x="1275" y="815" text-anchor="middle">dw tables</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#222">
    <line x1="35" y1="875" x2="85" y2="875" stroke="#3b6ea5" stroke-width="3" marker-end="url(#m)"/>
    <text x="95" y="880">main data path (daily incremental load)</text>
    <line x1="420" y1="875" x2="470" y2="875" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
    <text x="480" y="880">model scoring and BigQuery cross-check</text>
  </g>
</svg>
