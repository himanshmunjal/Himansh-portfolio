<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-rh="true">Himansh Munjal — AI Engineer | Data Science | Full Stack Developer</title>
    <meta name="description" data-rh="true" content="Portfolio of Himansh Munjal — Computer Science (Data Science) student at VIT Vellore building machine learning systems, NLP pipelines and full-stack applications." />
    <meta name="author" data-rh="true" content="Himansh Munjal" />
    <meta name="theme-color" data-rh="true" content="#1b1a17" />
    <link rel="canonical" data-rh="true" href="https://himansh-portfolio.vercel.app/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (crawlers don't run JS: each route gets its own copy of this file with these tags filled in at build time, see prerenderMeta in vite.config.ts; data-rh lets react-helmet replace them on client-side navigation) -->
    <meta property="og:type" data-rh="true" content="website" />
    <meta property="og:site_name" data-rh="true" content="Himansh Munjal" />
    <meta property="og:title" data-rh="true" content="Himansh Munjal — AI Engineer | Data Science | Full Stack Developer" />
    <meta property="og:description" data-rh="true" content="Machine learning systems, NLP pipelines and full-stack applications by Himansh Munjal, Data Science student at VIT Vellore." />
    <meta property="og:url" data-rh="true" content="https://himansh-portfolio.vercel.app/" />
    <meta property="og:image" data-rh="true" content="https://himansh-portfolio.vercel.app/og-image.jpg" />
    <meta property="og:image:width" data-rh="true" content="1200" />
    <meta property="og:image:height" data-rh="true" content="630" />
    <meta name="twitter:card" data-rh="true" content="summary_large_image" />
    <meta name="twitter:title" data-rh="true" content="Himansh Munjal — AI Engineer | Data Science | Full Stack Developer" />
    <meta name="twitter:description" data-rh="true" content="Machine learning systems, NLP pipelines and full-stack applications by Himansh Munjal." />
    <meta name="twitter:image" data-rh="true" content="https://himansh-portfolio.vercel.app/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Himansh Munjal",
        "url": "https://himansh-portfolio.vercel.app/",
        "image": "https://himansh-portfolio.vercel.app/images/profile.jpeg",
        "jobTitle": "AI / Data Science Engineer",
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Vellore Institute of Technology" },
        "knowsAbout": ["Machine Learning", "Deep Learning", "Natural Language Processing", "Data Science", "Full Stack Development"],
        "sameAs": [
          "https://github.com/himanshmunjal",
          "https://www.linkedin.com/in/himansh-munjal/"
        ]
      }
    </script>

    <!-- Apply the saved theme before first paint to avoid a dark→light flash.
         The CSP in vercel.json allows this script by its sha256 hash: if you edit it,
         recompute the hash or the script will be blocked in production. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
      } catch (e) {}
    </script>

    <!-- Self-hosted fonts (see @font-face in src/index.css); the two used above the fold are preloaded -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      Himansh Munjal — AI Engineer, Data Science student at VIT Vellore. Enable JavaScript to view this portfolio.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
